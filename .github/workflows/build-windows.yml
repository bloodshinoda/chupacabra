name: Build Windows

on:
  push:
    branches:
      - feature/engine-p0
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Compilar Chupacabra System para Windows
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache do Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependências do frontend
        run: npm ci

      - name: Instalar dependências Python do engine
        run: python -m pip install -r requirements-build.txt

      - name: Validar testes Python
        run: python -m unittest discover -s tests -v

      - name: Validar build do frontend
        run: npm run build

      - name: Gerar instalador NSIS
        run: npx tauri build --bundles nsis

      - name: Publicar instalador como artifact de CI
        uses: actions/upload-artifact@v4
        with:
          name: Chupacabra-System-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publicar instalador na Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
